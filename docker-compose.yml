services:
  web:
    build: .
    image: tibor-nemeth-cv
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const r = await fetch('http://localhost:3000/api/health'); if (!r.ok) Deno.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
